name: Beangrid

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "notebooks/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]

concurrency:
  group: beangrid
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # scrape stops retrying after fetch_budget_s (20 min)
    permissions:
      contents: write # commit the data/ archive
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-groups

      - name: Test
        run: uv run pytest -q

      # Last good raw payload per store, so a store that is down today can be carried forward.
      # Kept in the Actions cache rather than git to keep the repository small.
      - name: Restore store cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/sites
          key: beangrid-sites-${{ github.run_id }}
          restore-keys: beangrid-sites-

      - name: Scrape, archive and build site
        # Exits non-zero (and so skips commit + deploy) if too many stores fail.
        run: uv run beangrid run

      - name: Save store cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/sites
          key: beangrid-sites-${{ github.run_id }}

      # Rebase before pushing: code pushed to main while the scrape ran would otherwise reject the
      # push. Safe because only this workflow writes data/ and its runs never overlap (concurrency).
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No archive changes"; exit 0; fi
          git commit -q -m "Daily price archive"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build Jupyter Lite
        run: uv run jupyter lite build --contents notebooks/jupyterlite --output-dir _site/jupyterlite

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

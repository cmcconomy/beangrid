[project]
name = "beangrid"
version = "2.0.0"
description = "Daily survey of Canadian specialty coffee bean prices from roaster Shopify stores"
authors = [{ name = "Craig McConomy" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
beangrid = "beangrid.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Only needed to build the in-browser Jupyter environment published with the site.
lite = ["jupyterlite-core>=0.4", "jupyterlite-pyodide-kernel>=0.4", "jupyter-server>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beangrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
